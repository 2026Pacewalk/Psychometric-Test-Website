<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TestPsychometric">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4da3"/>
      <stop offset="0.55" stop-color="#1c357e"/>
      <stop offset="1" stop-color="#122259"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#19a35a"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8bf0"/>
      <stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#f6821f"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7b3ff2"/>
      <stop offset="1" stop-color="#5b27c4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a163f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App-icon squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>

  <!-- White sticker emblem -->
  <g filter="url(#soft)">
    <!-- Outer white disc behind the colour ring (sticker look) -->
    <circle cx="256" cy="252" r="158" fill="#ffffff"/>

    <!-- Four-colour brain ring (thick arcs with small gaps) -->
    <g fill="none" stroke-width="44" stroke-linecap="round">
      <!-- top-left : blue -->
      <path d="M 256 124 A 128 128 0 0 0 128 252" stroke="url(#gBlue)"/>
      <!-- top-right : orange -->
      <path d="M 256 124 A 128 128 0 0 1 384 252" stroke="url(#gOrange)"/>
      <!-- bottom-right : purple -->
      <path d="M 384 252 A 128 128 0 0 1 256 380" stroke="url(#gPurple)"/>
      <!-- bottom-left : green -->
      <path d="M 256 380 A 128 128 0 0 1 128 252" stroke="url(#gGreen)"/>
    </g>

    <!-- Head profile (faces right), navy -->
    <path fill="#15296b" d="
      M 232 350
      C 196 350 170 322 170 286
      C 170 244 198 214 240 210
      C 262 208 280 214 296 226
      C 310 236 322 244 332 246
      C 342 248 344 256 338 262
      C 332 268 330 272 332 280
      C 334 288 330 292 322 292
      L 312 292
      C 308 292 306 294 306 300
      L 306 332
      C 306 344 298 350 286 350
      Z"/>
    <!-- small nose/brow notch -->
    <path fill="#15296b" d="M 332 246 c 10 2 16 8 14 16 c -2 6 -10 6 -16 2 c -6 -4 -6 -16 2 -18 z"/>

    <!-- White check badge over the temple -->
    <circle cx="250" cy="258" r="46" fill="#ffffff"/>
    <path d="M 228 258 l 14 15 l 30 -32" fill="none" stroke="#15347f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
